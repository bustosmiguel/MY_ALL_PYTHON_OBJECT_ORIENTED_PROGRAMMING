<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>RegressionData - Dashboard</title>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 350px; border-top: 8px solid #3498db; }
h1 { color: #2c3e50; margin-bottom: 0.5rem; font-size: 1.5rem; }
.data-box { background: #f9f9f9; padding: 1rem; border-radius: 10px; margin: 1.5rem 0; border: 1px solid #ddd; }
.label { font-size: 0.8rem; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; }
.value { font-size: 1.2rem; color: #2c3e50; font-weight: bold; display: block; margin-top: 5px; }
.total { font-size: 2rem; color: #27ae60; }
.btn { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
.btn:hover { background: #2980b9; }
</style>
</head>
<body>
<div class="card">
<h1>REGRESSION DATA</h1>
<p style="color: #95a5a6;">Sistema de Facturación IA</p>

<div class="data-box">
<span class="label">Cliente</span>
<span id="cliente" class="value">Cargando...</span>
</div>

<div class="data-box">
<span class="label">Total a Pagar</span>
<span id="total" class="value total">$ 0.00</span>
</div>

<button class="btn" onclick="actualizar()">Refrescar Datos</button>
</div>

<script>
function actualizar() {
fetch('/api/data') // Pedimos los datos al servidor de Node
.then(response => response.json())
.then(data => {
document.getElementById('cliente').innerText = data.cliente;
document.getElementById('total').innerText = `$ ${data.total}`;
})
.catch(err => console.error("Error al obtener datos:", err));
}
// Carga inicial
actualizar();
</script>
</body>
</html>
